name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: python3 scripts/verify_translations.py
      - run: ./gradlew :core:test :launcher:testDebugUnitTest :launcher:lintDebug :launcher:assembleDebug :launcher:assembleRelease
      - run: >-
          python3 scripts/verify_apk.py launcher/build/outputs/apk/debug/launcher-debug.apk
          --readelf "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          --zipalign "$ANDROID_HOME/build-tools/37.0.0/zipalign"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: |
            launcher/build/outputs/apk/
            launcher/build/reports/
            core/build/reports/tests/
            terminal/build/busybox/source.tar.gz
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The emulator's 6 GB data partition does not fit beside the runner's preinstalled tools.
      - run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/az /usr/lib/google-cloud-sdk
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Finish compilation and release its Gradle process before the emulator uses RAM.
      - run: ./gradlew :launcher:assembleDebug :launcher:assembleDebugAndroidTest --max-workers=2 --no-daemon
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 37 has no plain google_apis image; this one also runs with 16 KB pages.
          # Its SDK packages are named 37.0 (platforms;android-37.0).
          api-level: '37.0'
          arch: x86_64
          target: google_apis_ps16k
          profile: pixel_8
          # This API 37 image enforces a 4 GB minimum; keep the test-only JVM small.
          ram-size: 4096
          disable-animations: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          # Preserve Pixel 8's dp layout with one quarter of the software-rendered pixels.
          pre-emulator-launch-script: >-
            sed -i -e 's/^hw.lcd.width=.*/hw.lcd.width=540/'
            -e 's/^hw.lcd.height=.*/hw.lcd.height=1200/'
            -e 's/^hw.lcd.density=.*/hw.lcd.density=210/'
            "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: ./gradlew :launcher:connectedDebugAndroidTest --max-workers=2 --no-daemon '-Dorg.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests
          path: |
            launcher/build/reports/androidTests/
            launcher/build/outputs/androidTest-results/
