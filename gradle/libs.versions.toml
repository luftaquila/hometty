[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
hilt = "2.60.1"
compose = "2026.11.01"
room = "2.8.5"
[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.13.0" }
junit = { module = "junit:junit", version = "4.13.2" }
android-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
activity = { module = "androidx.activity:activity-compose", version = "1.13.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.11.1" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
datastore = { module = "androidx.datastore:datastore", version = "1.3.0" }
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.12.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.1" }
jsoup = { module = "org.jsoup:jsoup", version = "1.24.1" }
android-test = { module = "androidx.test.ext:junit", version = "1.3.0" }
android-runner = { module = "androidx.test:runner", version = "1.7.0" }
re2j = { module = "com.google.re2j:re2j", version = "1.8" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
